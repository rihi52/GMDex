  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Skip this step if you commit the generated *.g.dart files
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build linux --release

      # Tar preserves the executable bit (artifact zips do not)
      - name: Package Linux bundle
        run: tar -czf linux-release.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: linux-release.tar.gz

  build-macos:
    name: build-macos (${{ matrix.arch }})
    strategy:
      fail-fast: false # if one arch fails, the other still finishes
      matrix:
        include:
          - runner: macos-15-intel # Intel
            arch: intel
          - runner: macos-latest # Apple Silicon
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Skip this step if you commit the generated *.g.dart files
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build macos --release

      # ditto keeps the .app bundle structure and permissions intact
      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/*.app macos-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: macos-${{ matrix.arch }}.zip
